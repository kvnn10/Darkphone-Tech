<path d="M158 96c11-8 24-6 31 4 5 8 4 17-2 24l-11 12-12-10 9-11c3-4 2-8-1-10-4-2-7 0-10 3l-13 14-10-10 19-16Z" fill="url(#black)"/>
<!-- gear one -->
<g transform="translate(151 91)" fill="url(#black)">
<rect x="-4.5" y="-26" width="9" height="10" rx="1"/><rect x="-4.5" y="16" width="9" height="10" rx="1"/><rect x="-26" y="-4.5" width="10" height="9" rx="1"/><rect x="16" y="-4.5" width="10" height="9" rx="1"/>
<rect x="-4.5" y="-26" width="9" height="10" rx="1" transform="rotate(45)"/><rect x="-4.5" y="16" width="9" height="10" rx="1" transform="rotate(45)"/><rect x="-26" y="-4.5" width="10" height="9" rx="1" transform="rotate(45)"/><rect x="16" y="-4.5" width="10" height="9" rx="1" transform="rotate(45)"/>
<circle r="18"/><circle r="9" fill="url(#silver)"/>
</g>
<!-- gear two -->
