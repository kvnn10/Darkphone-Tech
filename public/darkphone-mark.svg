<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
<title id="title">DarkPhone</title><desc id="desc">White Apple-shaped repair emblem with a hand and two black gears.</desc>
<defs><linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".58" stop-color="#f0f2f5"/><stop offset="1" stop-color="#c2cad5"/></linearGradient><linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171a1f"/><stop offset="1" stop-color="#050607"/></linearGradient></defs>
<rect width="240" height="240" rx="48" fill="url(#black)"/>
<rect x="1" y="1" width="238" height="238" rx="47" fill="none" stroke="#aeb9c9" stroke-opacity=".19"/>
<path d="M122 49C118 28 137 13 159 10c1 21-15 38-37 39Z" fill="url(#silver)"/>
<path d="M118 73C96 54 65 60 48 80 29 102 31 139 43 169c9 23 22 44 35 46 12 2 20-9 34-9 13 0 23 10 37 8 15-2 28-22 36-39-20-11-30-30-25-48 3-12 11-21 23-28-15-24-43-31-65-21Z" fill="url(#silver)"/>
