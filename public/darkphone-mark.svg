<rect x="-3.5" y="-20" width="7" height="8" rx="1"/><rect x="-3.5" y="12" width="7" height="8" rx="1"/><rect x="-20" y="-3.5" width="8" height="7" rx="1"/><rect x="12" y="-3.5" width="8" height="7" rx="1"/>
<rect x="-3.5" y="-20" width="7" height="8" rx="1" transform="rotate(45)"/><rect x="-3.5" y="12" width="7" height="8" rx="1" transform="rotate(45)"/><rect x="-20" y="-3.5" width="8" height="7" rx="1" transform="rotate(45)"/><rect x="12" y="-3.5" width="8" height="7" rx="1" transform="rotate(45)"/>
<circle r="13.5"/><circle r="6" fill="url(#silver)"/>
